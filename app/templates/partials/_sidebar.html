<script>
function fetchEmails() {
    if (confirm('Fetch new emails from your email server?')) {
        fetch('{{ url_for("main.fetch_emails") }}', {
            method: 'POST',
            headers: {
                'X-CSRFToken': ''



            }
        }).then(response => {
            if (response.ok) {
                window.location.reload();
            } else {
                alert('Failed to fetch emails. Please try again.');
            }
        });
    }
}
</script>
